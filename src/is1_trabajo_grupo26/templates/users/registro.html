{% extends "base.html" %}

{% block title %}Registro de usuario — Foro Q&amp;A{% endblock %}

{% block content %}
    <section class="card">
        <h1>Registro</h1>
        {% if error %}
            <p class="flash flash-danger">{{ error }}</p>
        {% endif %}

        <form method="POST">
            <label for = "nombre">Nombre</label>
            <input id="nombre" type="text" name="nombre" value="{{ nombre or '' }}">

            <label for="email">Email</label>
            <input id="email" type="email" name="email" value="{{ email or '' }}">

            <label for="password">Password</label>
            <input id="password" type="password" name="password">
            <button class="btn btn-primary" type="submit" style="margin-top: 12px;">Crear cuenta</button>
        </form>
    </section>
{% endblock %}
